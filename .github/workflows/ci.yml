name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oxc:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Installed once here, the other jobs restore it
      - id: modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: bun run check

  build:
    needs: oxc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          fail-on-cache-miss: true
      - run: bun run build

  # Unit and e2e start with build, neither needs its output
  unit:
    needs: oxc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          fail-on-cache-miss: true
      - run: bun run test:unit

  # One job per engine, headless only: Chrome, Firefox and Safari
  e2e:
    needs: oxc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v${{ needs.oxc.outputs.playwright }}-noble
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          fail-on-cache-miss: true
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: bun run test:e2e --project=${{ matrix.browser }}
        env:
          HOME: /root
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7
