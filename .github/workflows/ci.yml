name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - id: modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v${{ needs.install.outputs.playwright }}-noble
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: check
            run: check
          - name: build
            run: build
          - name: unit
            run: test:unit
          - name: e2e (chromium)
            run: test:e2e --project=chromium
            report: chromium
          - name: e2e (firefox)
            run: test:e2e --project=firefox
            report: firefox
          - name: e2e (webkit)
            run: test:e2e --project=webkit
            report: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          fail-on-cache-miss: true
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: bun run ${{ matrix.run }}
        env:
          HOME: /root
      - if: ${{ failure() && matrix.report }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.report }}
          path: playwright-report
          retention-days: 7
