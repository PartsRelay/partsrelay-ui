version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      major:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']

  - package-ecosystem: devcontainers
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      devcontainers:
        patterns: ['*']
